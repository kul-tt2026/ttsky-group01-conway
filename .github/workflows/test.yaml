name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep '<failure' results.xml

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
            
  test_logica: # Deel Sieben; Github test structuur geschreven door Claude Opus 5
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Run standalone testbenches
        run: make -C src/logica simulate_all

      - name: Run L_main cocotb test
        if: success() || failure()
        run: |
          make -C src/logica simulate_L_main
          ! grep '<failure' src/logica/results.xml

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "src/logica/results.xml"
        if: always()

      - name: Upload waveforms and results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: logica-test-results
          path: |
            src/logica/results.xml
            src/logica/*.vcd

  test_vga: # Deel Mathias
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Run VGA cocotb tests
        run: |
          make -C src/vga cocotb_all
          ! grep '<failure' src/vga/results.xml

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "src/vga/results.xml"
        if: always()

      - name: Upload waveforms and results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: vga-test-results
          path: |
            src/vga/results.xml
            src/vga/*.fst
            src/vga/*.vcd

  test_project_helpers: # porject_controller, sim_speed, next_iter_countdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Run standalone testbenches
        run: make -C src simulate_sim_speed simulate_next_iter_countdown simulate_project_controller

      - name: Upload waveforms and results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: project_helpers-test-results
          path: |
            src/*.vcd
